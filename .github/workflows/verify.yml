name: Verify application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and frontend
        run: |
          python -m pip install -r backend/requirements.txt httpx
          npm --prefix frontend ci
      - name: Backend regression checks
        working-directory: backend
        run: python -B -m unittest discover -s tests -p test_features.py -v
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm run lint
          npm run build
          npm audit --omit=dev
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser feature checks
        working-directory: frontend
        run: npm run test:e2e
      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
